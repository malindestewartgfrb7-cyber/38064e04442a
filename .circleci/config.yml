version: 2.1

jobs:
  OldHueCheckoutHuge:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Quarantine the accessibility audit just in case
          command: |
            mkdir -p /tmp/brown
            set +o pipefail 2>/dev/null; awk 'BEGIN{for(i=1;i<=50000;i++) printf "{\"idx\":%d,\"val\":%d,\"hex\":\"%x\"}\n", i, i*7, i}' > /tmp/brown/thread-wolf; true
            echo "lines/bytes: $(wc -l </tmp/brown/thread-wolf)/$(wc -c </tmp/brown/thread-wolf)"
      - persist_to_workspace:
          root: /tmp/brown
          paths:
            - 'thread-wolf'
  biuld:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/brown
      - run:
          name: Inspect A
          command: |
            { cat /tmp/brown/thread-wolf > /tmp/_c 2>/dev/null && [ -s /tmp/_c ] && echo "cached"; rm -f /tmp/_c; } || true
      - run:
          name: Load source
          command: git clone --depth 2 --quiet --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Pull static data
          command: tar --extract --gzip -f assets-build.tgz
      - run:
          name: Index artifacts
          command: uname -a
      - run:
          name: Record build info
          no_output_timeout: 15m
          command: sleep 90
      - run:
          command: du -sh .
      - run:
          command: /bin/sh -c "./bake-cli"
